name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Audit Wikipedia corpus
        run: npm run audit:data

      - name: Build and test
        run: npm test

      - name: Verify Codex Sites build output
        shell: bash
        run: |
          test -f dist/server/index.js
          test -f dist/.openai/hosting.json
          test -d dist/.openai/drizzle
          find dist/.openai/drizzle -name '*.sql' -print -quit | grep -q .
